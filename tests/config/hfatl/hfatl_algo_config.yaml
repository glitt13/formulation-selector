# hfatl_algo_config.yaml
# Config for testing parallelized algorithm training
task_type: 'clustering' # Or 'regression' if predicting NSE/KGE
save_all_clusters: True # Essential for capturing all cluster sizes in the output
algorithms:
  rf: 
    - n_estimators: [10, 50]
  kmeans:
    - n_clusters: [3, 5]
  gower_agglomerative:
    - n_clusters: [4, 6]
test_size: 0.3
seed: 32
name_attr_config: 'hfatl_attr_config.yaml'
verbose: True
read_type: 'filename'
make_plots: True
same_test_ids: True
uncertainty:
  confidence_levels: [90, 95]
  forestci:
    - fci_flag: True
  mapie:
    - alpha: [0.05, 0.32]
    - method: 'plus'
    - cv: 5
    - agg_function: 'median'