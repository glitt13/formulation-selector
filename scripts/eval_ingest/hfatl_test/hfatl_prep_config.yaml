# Prepare the Julie Mai xSSA metrics datasets from 2022 Nature Comm pub
col_schema:   # required column mappings in the evaluation metrics dataset
  - 'gage_id': 'divide_id' # The basin identifier/gage id used for each modeled location in the evaluation metrics dataset
  - 'featureID': 'hfuid-{gage_id}' # python f-string / R glue() format; converting the 'gage_id' to the standardized featureID used by nhdplusTools. Must use '{gage_id}' e.g. 'USGS-{gage_id}'
  - 'featureSource': 'hfuid' # The standardized nhdplusTools featureSource. Possible featureSources might be 'nwissite', 'comid'.
  - 'metric_cols': 'wltsmc' # Column(s) in the dataset corresponding to the evaluation metrics. If multiple exist, separate each string by '|' e.g. 'rmse|kge|nse'
  - 'metric_mappings': 'fake' # The mapping of metric_cols to the standardized format as specified in fs_categories.yaml, separate each metric name by '|' e.g. 'RMSE|KGE|NSE'
file_io: # May define {home_dir} for python's '{home_dir}/string_path'.format(home_dir =str(Path.home())) functionality
  - 'home_dir': '~' # OPTIONAL, define the home_dir path. If undefined, fs_prep will automatically assume default '~' 
  #- 'path_camels': '{home_dir}/noaa/camels/camels_hydro.txt' # Path to the CAMELS basins dataset. CAMELS data should not always be a requirement for dataset processing, but serves to help analyze common catchments.
  - 'path_data': '{home_dir}/noaa/regionalization/data/raw/hfatl_test/hfatl_fake_dat.csv' # Where the raw input data are stored.
  - 'dir_save': '{home_dir}/noaa/regionalization/data/input' # Required. The save location of standardized output
  - 'save_type': 'netcdf' #  Required. Save as hierarchical files 'netcdf' or 'zarr'. Default 'netcdf' until attribute 
  - 'save_loc': 'local' #  Required.  Use 'local' for saving to a local path via dir_save. Future work will create an approach for 'aws' or other cloud saving methods
formulation_metadata:  
  - 'dataset_name': 'test-hfatl' # Required. 
  - 'formulation_base': 'test_regnl' # Required. Basename of formulation. the rr, sp, and gw will be added to this if 'formulation_id' is left empty
  - 'formulation_id': 'test_regnl' # Optional alternative in lieu of generating a formulation_id based on 'formulation_base'. Should leave empty if automatic formulation_id generation desired.
  - 'formulation_ver': # Optional. The version of the formulation
  - 'temporal_res': '' # The temporal resolution corresponding to the modeled data
  - 'target_var': 'param' # Required. The target variable modeled. This is standardized. See target_var_mappings in fs_categories.yaml
  - 'start_date': '1980-01-01' # Required. The YYYY-MM-DD start date corresponding to the evaluation metric's modeled timeseries
  - 'end_date':  '2010-01-01' # Required. The YYYY-MM-DD end date corresponding to the evaluation metric's modeled timeseries
  - 'modeled notes': 'Test case using data that does not matter, the wltsmc created in the hfATLAS pipeline'
  - 'cal_status': 'N' # Required. Was the formulation model fully calibrated? Options include 'Y','N', or 'S' (yes/no/somewhat)
  - 'start_date_cal': '1980-01-01' # The YYYY-MM-DD start date corresponding to the calibration period
  - 'end_date_cal': '2010-01-01' # The YYYY-MM-DD end date corresponding to the calibration period
  - 'cal_notes': 'Not calibrated. Ignore all calibration references'
references: # All optional but **very** helpful metadata
  - 'input_filepath': '{base_dir}/git/hydrofabricATLAS/workflow/nwmv4_static_params/results/apr26cal_hf22/final/apr26cal_hf22_final.parquet'
  - 'source_url': 'NA'
  - 'dataset_doi': 'NA'
  - 'literature_doi': 'NA'
