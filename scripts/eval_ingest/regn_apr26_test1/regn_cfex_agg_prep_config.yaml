# Prepare the Input attributes datasets from calibration for regionalization
col_schema:   # required column mappings in the input attributes dataset
  - 'gage_id': 'site_id' # The basin identifier/gage id used for each modeled location in the input dataset
  - 'featureID': '{gage_id}' # python f-string / R glue() format; converting the 'gage_id' to the standardized featureID used by nhdplusTools. Must use '{gage_id}' e.g. 'USGS-{gage_id}'
  - 'featureSource': 'hfv22_id' # The standardized nhdplusTools featureSource. Possible featureSources might be 'nwissite', 'comid', 'hfv22_id', hfv30_id
  - 'metric_cols': "b|satdk|satpsi|slope|maxsmc|wltsmc|max_gw_storage|Cgw|expon|alpha_fc|Kn|Klf|Kinf_nash_surface|retention_depth_nash_surface|a_Xinanjiang_inflection_point_parameter|b_Xinanjiang_shape_parameter|x_Xinanjiang_shape_parameter|MFSNO|SCAMAX|RSURF_SNOW|CWP|VCMX25|MP" # Column(s) in the dataset corresponding to the evaluation metrics. If multiple exist, separate each string by '|' e.g. 'rmse|kge|nse'
  - 'metric_mappings': "b|satdk|satpsi|slope|maxsmc|wltsmc|max_gw_storage|Cgw|expon|alpha_fc|Kn|Klf|Kinf_nash_surface|retention_depth_nash_surface|a_Xinanjiang_inflection_point_parameter|b_Xinanjiang_shape_parameter|x_Xinanjiang_shape_parameter|MFSNO|SCAMAX|RSURF_SNOW|CWP|VCMX25|MP" # The mapping of metric_cols to the standardized format as specified in fs_categories.yaml, separate each metric name by '|' e.g. 'RMSE|KGE|NSE'
  - 'val_metrics': 'False'
file_io: # May define {home_dir} for python's '{home_dir}/string_path'.format(home_dir =str(Path.home())) functionality
  - 'home_dir': '~' # OPTIONAL, define the home_dir path. If undefined, fs_prep will automatically assume default '~' 
  - 'path_data': '{home_dir}/noaa/regionalization/data/raw/regn_apr26_test1/sloth_noahowp_cfe_x_selected_params.parquet' # Where the raw input data are stored.
  - 'data_source': 'hfATLAS_hf22' # The hydrofabricATLAS dataset version (may need to update with major version changes, or somehow integrate with dvc tracking)
  - 'dir_save': '{home_dir}/noaa/regionalization/data/input' # Required. The save location of standardized output
  - 'save_type': 'netcdf' #  Required. Save as hierarchical files 'netcdf' or 'zarr'. Default 'netcdf' until attribute 
  - 'save_loc': 'local' #  Required.  Use 'local' for saving to a local path via dir_save. Future work will create an approach for 'aws' or other cloud saving methods
  - 'path_hf_gpkg': "{home_dir}/noaa/regionalization/data/raw/regn_apr26_test1/hf22_regn_apr26_gages.gpkg" # The path to the gpkg containing the hfATLAS divides. This is required for mapping the divide_id to the standardized featureID and featureSource.
  - 'hf_divides_layer': "divides"         # The layer name inside the gpkg
  - 'map_divide_id_col': "divide_id"     # The column name in your metadata mapping CS
  - 'hf_fp_layer': "gages" # Hydrofabric layer name for flowpaths layer
  - 'hf_fp_id_col': "id" # The column name in the flowpaths layer corresponding to the flowpath outlet of the divide
  - 'vpu_id_col': "vpuid" # The column name in the hydrofabric flowpaths layer
  - 'vpu_mapped': 'True' # Boolean str. Should output attribute data be organized by vpu? True recommended for large datasets, e.g. entire CONUS scale.
formulation_metadata:  
  - 'dataset_name': 'regn_apr26_cfexnom' # Required. 
  - 'formulation_base': 'cfexnom' # Required. Basename of formulation. the rr, sp, and gw will be added to this if 'formulation_id' is left empty
  - 'formulation_id':  # Optional alternative in lieu of generating a formulation_id based on 'formulation_base'. Should leave empty if automatic formulation_id generation desired.
  - 'formulation_ver': # Optional. The version of the formulation
  - 'temporal_res': '' # The temporal resolution corresponding to the modeled data
  - 'target_var': 'param' # Required. The target variable modeled. This is standardized. See target_var_mappings in fs_categories.yaml
  - 'start_date': '1980-01-01' # Required. The YYYY-MM-DD start date corresponding to the evaluation metric's modeled timeseries
  - 'end_date':  '2010-01-01' # Required. The YYYY-MM-DD end date corresponding to the evaluation metric's modeled timeseries
  - 'modeled notes': 'Test case using data that does not matter, the wltsmc created in the hfATLAS pipeline'
  - 'cal_status': 'N' # Required. Was the formulation model fully calibrated? Options include 'Y','N', or 'S' (yes/no/somewhat)
  - 'start_date_cal': '1980-01-01' # The YYYY-MM-DD start date corresponding to the calibration period
  - 'end_date_cal': '2010-01-01' # The YYYY-MM-DD end date corresponding to the calibration period
  - 'cal_notes': "April 2026 CFEx-NOM calibration results, processed by Lauren's first ngen-fs output: equally-weighted combo of NNSE + MAPPE"
references: # All optional but **very** helpful metadata
  - 'input_filepath': '{base_dir}/noaa/regionalization/data/raw/regn_apr26_test1/noahowp_cfexnom_selected_params.parquet'
  - 'source_url': 
  - 'dataset_doi': 'NA'
  - 'literature_doi': 'NA'
